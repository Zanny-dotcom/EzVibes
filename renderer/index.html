<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZvibes</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar" data-panel-id="topbar">
        <div class="window-title" data-panel-id="window-title">EZvibes</div>
        <div class="nav-buttons" data-panel-id="nav-buttons-group">
          <button id="back-btn" class="icon-button" title="Back" data-panel-id="back-btn">‹</button>
          <button id="up-btn" class="icon-button" title="Up" data-panel-id="up-btn">↑</button>
          <button id="refresh-btn" class="icon-button" title="Refresh" data-panel-id="refresh-btn">↻</button>
        </div>
        <div id="path-bar" class="path-bar" data-panel-id="path-bar"></div>
        <div class="search-wrap">
          <input id="search-input" type="search" placeholder="Search folders" data-panel-id="search-input" />
        </div>
        <button id="narration-toggle" class="icon-button narration-toggle" title="What Was Made" aria-pressed="false" data-panel-id="narration-toggle">▤</button>
        <button id="panel-mode-toggle" class="icon-button panel-mode-toggle" title="Panel Mode" aria-pressed="false" data-panel-id="panel-mode-toggle">◫</button>
        <button id="live-log-toggle" class="icon-button live-log-toggle" title="Live Log" aria-pressed="false" data-panel-id="live-log-toggle">LOG</button>
      </header>

      <main class="shell">
        <aside class="sidebar" data-panel-id="sidebar">
          <button id="active-sessions-btn" class="quick-path active-sessions-link" type="button" data-panel-id="active-sessions-btn">
            ACTIVE SESSIONS
          </button>
          <div class="sidebar-section-title">Places</div>
          <div id="quick-paths" data-panel-id="quick-paths-list"></div>
        </aside>

        <section class="content" data-panel-id="content">
          <div class="command-bar" data-panel-id="command-bar">
            <button id="new-session-btn" class="command-button launch-claude-btn" type="button" title="Launch Claude Here" aria-label="Launch Claude Here" data-panel-id="new-session-btn">
              <svg class="claude-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" focusable="false">
                <ellipse cx="16" cy="16" rx="2" ry="13" />
                <ellipse cx="16" cy="16" rx="13" ry="2" />
                <g transform="rotate(45 16 16)">
                  <ellipse cx="16" cy="16" rx="1.8" ry="8.5" />
                  <ellipse cx="16" cy="16" rx="8.5" ry="1.8" />
                </g>
              </svg>
            </button>
            <button id="inbox-btn" class="command-button inbox-button" type="button" aria-haspopup="dialog" aria-expanded="false" data-panel-id="inbox-btn">inbox</button>
            <button id="activate-btn" class="command-button activate-button" type="button" data-panel-id="activate-btn">ACTIVATE</button>
            <button id="new-folder-btn" class="command-button new-folder-button" type="button" data-panel-id="new-folder-btn">New Folder</button>
            <div id="folder-count" class="folder-count" data-panel-id="folder-count"></div>
          </div>
          <div id="grid" class="folder-grid" data-panel-id="folder-grid"></div>
        </section>

        <aside id="narration-sidebar" class="narration-sidebar" hidden data-panel-id="narration-sidebar">
          <div class="narration-header">
            <div>
              <div class="narration-title">What Was Made</div>
              <div id="narration-folder" class="narration-folder"></div>
            </div>
            <button id="narration-close" class="icon-button" title="Close">X</button>
          </div>
          <div id="narration-body" class="narration-body"></div>
        </aside>

        <aside id="live-log-panel" class="live-log-panel" hidden data-panel-id="live-log-panel">
          <div class="live-log-header">
            <div>
              <div class="live-log-title">Live Log</div>
              <div id="live-log-file" class="live-log-file"></div>
            </div>
            <button id="live-log-close" class="icon-button" title="Close">X</button>
          </div>
          <div id="live-log-body" class="live-log-body"></div>
        </aside>
      </main>
    </div>

    <div id="context-menu" class="context-menu" hidden></div>
    <div id="session-layer" class="session-layer"></div>
    <div id="inbox-popover" class="inbox-popover" role="dialog" aria-labelledby="inbox-title" hidden>
      <div class="inbox-glass">
        <div class="inbox-header">
          <div class="inbox-heading">
            <div id="inbox-title" class="inbox-title">Inbox</div>
            <div id="inbox-subtitle" class="inbox-subtitle"></div>
          </div>
          <button id="inbox-close" class="inbox-close" type="button" title="Close inbox" aria-label="Close inbox">X</button>
        </div>
        <div class="inbox-meta">
          <span id="inbox-count" class="inbox-count"></span>
        </div>
        <div id="inbox-body" class="inbox-body"></div>
      </div>
    </div>

    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./app.js"></script>
    <script src="./panel-mode.js"></script>
  </body>
</html>
